[project]
name = "rag-chatbot-backend"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.1",
    "bcrypt>=4.1.3",
    "python-jose[cryptography]>=3.3.0",
    "pymongo>=4.7.0",
    "google-genai>=0.8.0",
    "requests>=2.32.0",
    "chromadb>=0.5.0",
    "pypdf2>=3.0.0",
    "pydantic>=2.7.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",  # needed for file upload in FastAPI
    "rank-bm25>=0.2.2",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "pdf2image>=1.17.0",
]
